name: Deploy to Discloud

on:
  push:
    branches:
      - main # Change to 'master' if your default branch on GitHub is named master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Discloud Deploy
        uses: discloud/deploy-action@v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}