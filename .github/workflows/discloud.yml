name: Deploy to Discloud

on:
  push:
    branches:
      - main # If your default branch on GitHub is named master, change main to master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Discloud Deploy
        uses: discloud/action-deploy@v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}